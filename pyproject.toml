[tool.poetry]
name = "voice-recorder"
version = "0.1.0"
description = "A Mutter with automatic transcription"
authors = ["Your Name <your.email@example.com>"]
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
# 3.11 is what the README installs and what both machines run; the old
# ">=3.9" floor was pinning the whole native stack (numpy, onnxruntime, av,
# ctranslate2) to releases that still supported 3.9.
python = ">=3.11,<3.12"
PySide6 = "^6.11"
sounddevice = "^0.5.6"
numpy = "^2.0"
faster-whisper = "^1.2.1"
pywin32 = {version = ">=312", platform = "win32"}
cairosvg = "^2.9"
requests = "^2.34"

# Dependencies for local LLM processing (now included in regular build)
torch = "^2.14"
transformers = "^5.16"
python-xlib = {version = "^0.33", platform = "linux"}
pynput = "^1.8.2"
dbus-python = {version = "^1.4.0", platform = "linux"}
evdev = {version = "^2.0", platform = "linux"}

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
black = "^26.5"
isort = "^9.0"
mypy = "^2.3"
pyinstaller = "^6.22"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
mutter = "src.main:run_application" 